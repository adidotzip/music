name: Auto Fix & Check

on:
  push:
    branches:
      - main
      - "feat/**"
      - "ci/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: auto-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Biome + Type Check + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-fix Biome
        run: pnpm biome-fix

      - name: Check Biome
        run: pnpm biome-check

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Commit Biome fixes
        if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No automatic fixes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: auto-fix Biome"
          git push
